# MaxKB 本地验收编排：使用由本项目全量源码构建的镜像（构建定义见 Dockerfile.app）
#
# 用法（在仓库根目录执行）：
#   docker compose up -d --build
#   浏览器打开 http://localhost:8080
# 默认账号：admin / MaxKB@123..
#
# 说明：
#   1) 镜像由 Dockerfile.app 构建：以官方 1panel/maxkb 一体化镜像为底座，
#      叠加本仓库全量后端源码。容器内自带 PostgreSQL(pgvector) 与 Redis，
#      MAXKB_DB_HOST / MAXKB_REDIS_HOST 保持默认的 127.0.0.1 即可，无需额外服务。
#   2) 改动已经打进镜像，因此不再需要把源码文件挂载进容器。
#      改完代码后重新执行 docker compose up -d --build 即可生效。
#   3) 镜像版本与本地源码对应：本地源码为 v2.10.6-lts 标签之后 39 个提交，
#      且 pyproject.toml 与 v2.10.6-lts 完全一致，故底座固定用 v2.10.6-lts，不存在依赖错配。
#   4) 数据用 Windows 绑定挂载 C:/maxkb（与官方文档一致），在资源管理器里直接可见、可直接备份。
#      若想改回 Docker 命名卷（性能更好），把下面那行换成 maxkb-data:/opt/maxkb，
#      并取消文件末尾 volumes: 段的注释。

services:
  maxkb:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: maxkb-app:v2.10.6-lts
    container_name: maxkb-verify
    restart: unless-stopped
    ports:
      - "8080:8080"
      # 把容器内的 PostgreSQL / Redis 映射出来，方便本地开发环境或 Navicat 等客户端直连。
      # 前缀 127.0.0.1 表示只监听本机，不会暴露到局域网，安全。
      - "127.0.0.1:15432:5432"
      - "127.0.0.1:16379:6379"
    volumes:
      - C:/maxkb:/opt/maxkb
    environment:
      - MAXKB_PDF_HEADING_PATTERN_ENABLE=true
      - MAXKB_PDF_OCR_ENABLE=true
      - MAXKB_PDF_OCR_MAX_PAGES=100
      - MAXKB_PDF_OCR_IMAGE_MAX_SIDE=2000
      - MAXKB_LOG_LEVEL=INFO

# 改用绑定挂载后，原先的命名卷 maxkb-data 已不再使用（数据仍在，未删除，可随时切回）：
# volumes:
#   maxkb-data:
